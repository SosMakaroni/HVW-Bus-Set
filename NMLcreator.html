        function langgen() {
            const fileInput = document.getElementById(`fileInput`);
            const file = fileInput.files[0];

            if (!file) {
                alert(`Kérlek töltsd fel az Excel fájlt!`);
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: `array` });
                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
				// Feltételezzük, hogy az első sor tartalmazza a fejlécet
				const headers = json[0]; // Az első sor, amely az oszlopneveket tartalmazza
				const columnMapping = {};
				// Dinamikus oszlopfeltérképezés
				headers.forEach((header, index) => {
					columnMapping[header] = index;
				});

                let outputText = ``;

                json.forEach((row, index) => {
                    if (index === 0 || row.every(cell => cell === undefined || cell === null || cell === ``)) return;

                    const ItemID = row[columnMapping[`ID`]] || ``;
                    const LoadingSpeed = row[columnMapping[`Total loading speed`]] || ``;
                    const Color = row[columnMapping[`Color`]] || ``;
                    const TextType = row[columnMapping[`Type`]] || ``;
                    const TextSType1 = row[columnMapping[`Subtype`]] || ``;
                    const TextSType2 = row[columnMapping[`Subtype 2`]] || ``;
                    const TextOther1 = row[columnMapping[`Other info`]] || ``;
                    const TextOther2 = row[columnMapping[`Other info 2`]] || ``;
                    const Fuel = row[columnMapping[`Fuel`]] || ``;
// üres kapcsoló ha nincs subtype 2 szöveg
                    let TextSType21 = `${TextSType2}, `;
                    if (TextSType2 == ``) {
                        TextSType21 = ``;
                    }
// Hajtás kapcsoló
                    let TextFuel = ``;
                    if (Fuel == `diesel`) {
                        TextFuel = `{GRAY}Diesel{BLACK}`;
                    } else if (Fuel == `hybrid`) {
                        TextFuel = `{BLUE}Hybrid{BLACK}`;
                    } else if (Fuel == `cng`) {
                        TextFuel = `{ORANGE}CNG{BLACK}`;
                    } else if (Fuel == `electric`) {
                        TextFuel = `{GREEN}Electric{BLACK}`;
                    } else if (Fuel == `petrol`) {
                        TextFuel = `{GRAY}Petrol{BLACK}`;

                const anchor = document.createElement(`a`);

                document.body.removeChild(anchor);
            };
            reader.readAsArrayBuffer(file);
